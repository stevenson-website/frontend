<div
  class="bg-opacity-50 border rounded w-64 h-64 sm:w-72 md:w-96 md:h-80"
  [ngClass]="{
    'bg-background-dark border-white text-white': (darkMode$ | async),
    'bg-white border-background-dark text-background-dark': !(darkMode$ | async)
  }"
>
  <!-- When removing this carousel remove also the packages "jquery", "ngx-slick-carousel" and "slick-carousel" -->
  <ngx-slick-carousel
    class="carousel w-full"
    #slickModal="slick-carousel"
    [config]="slideConfig"
  >
    <div ngxSlickItem *ngFor="let project of projects" class="slide">
      <project-card
        [title]="project.title"
        [description]="project.description"
        [imagePath]="project.imagePath"
        [link]="project.link"
      ></project-card>
    </div>
  </ngx-slick-carousel>
</div>

<button (click)="goToNextCard()" class="z-10">BUTTON</button>
