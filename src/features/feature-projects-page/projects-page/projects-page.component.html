<div class="pt-header"></div>

<div class="grid grid-cols-1 lg:grid-cols-3">
  <div
    class="mt-8 md:mt-16 mb-16 flex justify-start lg:col-span-2 flex justify-center items-center"
  >
    <div class="grid grid-cols-1 lg:grid-cols-10">
      <div class="mr-12 flex flex-col justify-end lg:col-span-3">
        <img
          class="h-0 lg:h-36 w-auto"
          *ngIf="darkMode$ | async"
          src="assets/pictures/icons/projects_arrow_light.svg"
        />
        <img
          class="h-0 lg:h-36 w-auto"
          *ngIf="!(darkMode$ | async)"
          src="assets/pictures/icons/projects_arrow_dark.svg"
        />
        <img
          class="h-24 lg:h-0 w-auto"
          *ngIf="darkMode$ | async"
          src="assets/pictures/icons/projects_arrow_down_light.svg"
        />
        <img
          class="h-24 lg:h-0 w-auto"
          *ngIf="!(darkMode$ | async)"
          src="assets/pictures/icons/projects_arrow_down_dark.svg"
        />
      </div>
      <div class="flex flex-col justify-center lg:col-span-7">
        <project-card-holder [projects]="projects"></project-card-holder>
      </div>
    </div>
  </div>

  <div class="flex justify-center items-center">
    <cube [cubeSize]="'SM'"></cube>
  </div>
</div>
