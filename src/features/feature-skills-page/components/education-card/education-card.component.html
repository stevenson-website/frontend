<div
  class="border rounded bg-opacity-50 grid grid-cols-1 md:grid-cols-3"
  [ngClass]="{
    'bg-background-dark': (darkMode$ | async),
    'bg-background-white': !(darkMode$ | async)
  }"
>
  <div class="flex justify-center md:justify-start">
    <education-logo class="col-span-1"></education-logo>
  </div>

  <div class="col-span-2 flex flex-col py-2 px-4 md:p-4">
    <div class="grid grid-cols-1 md:grid-cols-2">
      <div class="font-bold text-md md:text-xl text-center md:text-start">
        {{ title | translate }}
      </div>
      <div class="text-xs md:text-sm italic text-center md:text-right">
        {{ date | translate }}
      </div>
    </div>
    <div
      class="pt-2 md:pt-4 text-xs md:text-md break-words"
      [ngClass]="{
        'text-gray-light': (darkMode$ | async),
        'text-gray-main': !(darkMode$ | async)
      }"
    >
      {{ text | translate }}
    </div>
  </div>
</div>
