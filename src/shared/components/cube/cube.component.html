<canvas id="my-canvas"></canvas>

<div
  class="title"
  [ngClass]="{
      'text-md': cubeSize == 'SM',
      'text-lg': cubeSize == 'MD',
      'text-2xl': cubeSize == 'LG',
    }"
>
  <div class="flex-inline">
    {{ description | translate }}
    <mat-icon class="transform duration-300 rotate-180">rotate_right</mat-icon>
  </div>
</div>
