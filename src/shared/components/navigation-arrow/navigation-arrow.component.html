<div
  [ngClass]="{
    'stroke-primary-main hover:stroke-background-light text-background-light hover:text-primary-main':
      color === 'primary' && !(darkMode$ | async),
    'stroke-primary-main hover:stroke-background-dark text-background-dark hover:text-primary-main':
      color === 'primary' && (darkMode$ | async),
    'stroke-primary-second hover:stroke-background-dark text-background-dark hover:text-primary-second':
      color === 'second' && (darkMode$ | async),
    'stroke-primary-second hover:stroke-background-light text-background-light hover:text-primary-second':
      color === 'second' && !(darkMode$ | async),
  }"
>
  <ng-container *ngIf="direction === 'up'">
    <svg
      width="60px"
      height="60px"
      viewBox="0 0 24 24"
      fill="currentColor"
      xmlns="http://www.w3.org/2000/svg"
    >
      <path
        d="M15 11L12 8M12 8L9 11M12 8V16M21 12C21 16.9706 16.9706 21 12 21C7.02944 21 3 16.9706 3 12C3 7.02944 7.02944 3 12 3C16.9706 3 21 7.02944 21 12Z"
        stroke-width="1"
        stroke-linecap="round"
        stroke-linejoin="round"
      />
    </svg>
  </ng-container>

  <ng-container *ngIf="direction === 'down'">
    <svg
      width="60px"
      height="60px"
      viewBox="0 0 24 24"
      fill="currentColor"
      xmlns="http://www.w3.org/2000/svg"
    >
      <path
        d="M9 13L12 16M12 16L15 13M12 16V8M21 12C21 16.9706 16.9706 21 12 21C7.02944 21 3 16.9706 3 12C3 7.02944 7.02944 3 12 3C16.9706 3 21 7.02944 21 12Z"
        stroke-width="1"
        stroke-linecap="round"
        stroke-linejoin="round"
      />
    </svg>
  </ng-container>
</div>
